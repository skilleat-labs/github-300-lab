site_name: GitHub Copilot 실습 가이드 (GH-300)
site_description: GitHub Copilot 과정 교안과 실습 가이드
site_author: 스킬잇 김누리
site_url: https://skilleat-labs.github.io/github-300-lab/
repo_url: https://github.com/skilleat-labs/github-300-lab
repo_name: skilleat-labs/github-300-lab
edit_uri: ""

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - 홈: index.md
  - 시작 전 준비:
      - 1. 설치할 것: setup/1-install.md
      - 2. Copilot 로그인과 확인: setup/2-copilot.md
      - 3. 막혔을 때: setup/3-troubleshooting.md
  - 1교시 시작하기:
      - 교안: class1/index.md
      - 실습 1-1 환경 점검과 Copilot 설정: class1/lab-1.md
      - 실습 1-2 내 리포지토리 만들고 VS Code 익히기: class1/lab-2.md
      - 실습 1-3 Copilot에게 첫 질문: class1/lab-3.md
  - 2교시 기본기:
      - 교안: class2/index.md
      - 실습 2-1 인라인 제안과 다음 편집 제안: class2/lab-1.md
      - 실습 2-2 코드 설명 듣고 설명 주석 받기: class2/lab-2.md
      - 실습 2-3 버그 잡기와 커밋: class2/lab-3.md
  - 3교시 프롬프트와 맥락:
      - 교안: class3/index.md
      - 실습 3-1 회의록에서 사용자 스토리 뽑기: class3/lab-1.md
      - 실습 3-2 지침 파일 만들기: class3/lab-2.md
      - 실습 3-3 스킬로 아이디어 검토: class3/lab-3.md
  - 4교시 에이전트:
      - 교안: class4/index.md
      - 실습 4-1 브랜치와 계획: class4/lab-1.md
      - 실습 4-2 에이전트로 구현하고 테스트: class4/lab-2.md
      - 실습 4-3 PR과 CI: class4/lab-3.md
  - 5~6교시 개인 실습 (팀 실습 대신):
      - 개인 미션 1 스토리 하나를 끝까지: solo/mission-1.md
      - 개인 미션 2 배포 자동화: solo/mission-2.md
  - 5교시 팀 실습 ①:
      - 교안과 역할 카드: class5/index.md
      - 미션 5-0 팀 리포지토리 만들기: class5/mission-0.md
      - 미션 5-1 요구 정리와 분배: class5/mission-1.md
      - 미션 5-2 스토리 구현: class5/mission-2.md
  - 6교시 팀 실습 ②:
      - 교안: class6/index.md
      - 미션 6-1 PR과 리뷰: class6/mission-1.md
      - 미션 6-2 배포 자동화: class6/mission-2.md
      - 미션 6-3 변경 요청 처리: class6/mission-3.md
  - 7교시 책임과 내 업무 적용:
      - 교안: class7/index.md
      - 실습 7-1 보안 검토: class7/lab-1.md
      - 실습 7-2 내 업무 자동화 도구: class7/lab-2.md
      - 실습 7-3 팀 규칙, 활용 사례와 정리: class7/lab-3.md
  - 부록:
      - VS Code와 Copilot 한 장 정리: appendix/vscode-copilot.md
      - 프롬프트 모음: appendix/prompts.md
      - Starter 파일 보기: appendix/starter-files.md
      - 용어집: appendix/glossary.md
      - 강사용 진행 메모: appendix/instructor.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs", "."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
